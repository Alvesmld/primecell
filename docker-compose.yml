services:
  primecell:
    build: .
    container_name: primecell
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:3001"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_DIST_PATH: /app/client/dist
    volumes:
      - primecell_data:/app/server/data
      - primecell_uploads:/app/server/uploads

volumes:
  primecell_data:
  primecell_uploads:
